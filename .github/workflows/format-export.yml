name: Temporary formatter export
on:
  push:
    branches: [feat/serveragent-platform]
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install black ruff
      - name: Format and lint
        working-directory: backend
        run: |
          black app main.py tests
          ruff check --fix app main.py tests || true
          black app main.py tests
          ruff check app main.py tests || true
      - name: Export source difference
        working-directory: backend
        run: |
          python - <<'PY'
          import json
          import base64
          import subprocess
          from pathlib import Path
          files = subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
          payload = {name: Path("../" + name).read_text() for name in files if name.startswith("backend/") and name.endswith(".py")}
          print("FORMATTED_PAYLOAD:" + base64.b64encode(json.dumps(payload).encode()).decode())
          print("FORMATTED_FILES:" + ",".join(files))
          PY
