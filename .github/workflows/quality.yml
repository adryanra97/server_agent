name: Engineering quality
on:
  push:
    branches: [main, feat/serveragent-platform]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Consolidate sanitized JUnit/Vitest/Playwright and dependency evidence from each\n# job. Never publish test logs or API credentials.

jobs:
  backend-tests:
    name: Backend tests & coverage
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx pytest-cov black ruff
      - name: Run model and API tests with coverage
        id: pytest
        run: pytest -q --cov=app --cov=main --cov-branch --cov-report=term-missing --cov-report=xml --junitxml=pytest-results.xml
      - name: Build per-test report from JUnit XML
        if: always()
        run: |
          if [ -s pytest-results.xml ]; then
            python ../.github/scripts/pytest_report.py pytest-results.xml pytest-dashboard.json
          else
            echo "No JUnit test results to publish."
          fi
      - name: Upload full Pytest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend
          path: |
            backend/pytest-results.xml
            backend/pytest-dashboard.json
          if-no-files-found: ignore
      - name: Extract measured coverage
        id: coverage_metrics
        if: always()
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path("coverage.xml")
          line = branch = "unavailable"
          if report.exists():
              root = ET.parse(report).getroot()
              line = f"{float(root.attrib['line-rate']) * 100:.1f}"
              branch = f"{float(root.attrib['branch-rate']) * 100:.1f}"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"line={line}", file=output)
              print(f"branch={branch}", file=output)
          print(f"Measured coverage: line={line}% branch={branch}%")
          PY
      - name: "Coverage report: ${{ steps.coverage_metrics.outputs.line }}% line, ${{ steps.coverage_metrics.outputs.branch }}% branch"
        if: always()
        run: echo "Coverage values are taken from pytest's actual coverage.xml."
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore
  python-style:
    name: Python formatting & lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install quality tools
        run: pip install black ruff
      - name: Black
        run: black --check --diff app main.py tests
      - name: Ruff
        run: ruff check app main.py tests
  frontend:
    name: TypeScript & Next.js
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run lint
      - name: Build
        run: npm run build

  python-security:
    name: Bandit security analysis
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Bandit
        run: python -m pip install "bandit>=1.8,<2"
      - name: Generate security report
        run: bandit -r app main.py --format json --output bandit-report.json --exit-zero
      - name: Extract Bandit findings
        id: bandit_metrics
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from collections import Counter
          from pathlib import Path

          report = Path("bandit-report.json")
          counts = Counter()
          if report.exists():
              for finding in json.loads(report.read_text(encoding="utf-8")).get("results", []):
                  counts[finding.get("issue_severity", "").upper()] += 1
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for severity in ("HIGH", "MEDIUM", "LOW"):
                  print(f"{severity.lower()}={counts[severity]}", file=output)
          print(f"Bandit findings: HIGH={counts['HIGH']}, MEDIUM={counts['MEDIUM']}, LOW={counts['LOW']}")
          PY
      - name: "Bandit findings: H${{ steps.bandit_metrics.outputs.high }} M${{ steps.bandit_metrics.outputs.medium }} L${{ steps.bandit_metrics.outputs.low }}"
        if: always()
        run: echo "Severity counts are read from the Bandit JSON report."
      - name: Enforce security gate (medium severity and confidence or higher)
        run: bandit -r app main.py --severity-level medium --confidence-level medium
      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-security-report
          path: backend/bandit-report.json
          if-no-files-found: ignore

  frontend-tests:
    name: Frontend unit & component tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend test tooling
        run: npm install --no-audit --no-fund
      - name: Run Vitest component, contract and security regression tests
        run: npm run test:coverage
      - name: Upload measured Vitest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-unit
          path: |
            frontend/vitest-results.xml
            frontend/coverage/coverage-summary.json
            frontend/coverage/lcov.info
          if-no-files-found: ignore

  frontend-e2e:
    name: Browser end-to-end tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium test browser
        run: npx playwright install --with-deps chromium
      - name: Build Next.js for browser tests
        run: npm run build
      - name: Run real Chromium user journeys
        run: npm run test:e2e
      - name: Upload browser test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-e2e
          path: |
            frontend/playwright-results.xml
            frontend/test-results
          if-no-files-found: ignore

  frontend-security:
    name: Frontend dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies for audit resolution
        run: npm install --no-audit --no-fund
      - name: Scan production dependencies (npm audit)
        run: |
          npm audit --omit=dev --json > npm-audit.json || true
      - name: Read severity counts and enforce high/critical gate
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const report=JSON.parse(fs.readFileSync('npm-audit.json','utf8'));
          const n=report.metadata?.vulnerabilities;
          if(!n||report.error){
            console.error('npm audit evidence unavailable; failing closed');
            process.exit(1);
          }
          console.log('npm audit production findings:',JSON.stringify(n));
          if((n.high??0)+(n.critical??0)>0){
            console.error('High/critical production dependency vulnerabilities require review');
            process.exit(1);
          }
          NODE
      - name: Upload dependency audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit
          path: frontend/npm-audit.json
          if-no-files-found: ignore

  python-dependency-security:
    name: Python dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install vulnerability scanner
        run: pip install "pip-audit>=2.7,<3"
      - name: Audit declared Python dependencies
        run: pip-audit -r requirements.txt -f json -o pip-audit.json
      - name: Upload dependency audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-audit
          path: backend/pip-audit.json
          if-no-files-found: ignore

  publish-evidence:
    name: Publish verified quality evidence
    if: always() && github.event_name != 'pull_request'
    needs:
      - backend-tests
      - python-style
      - frontend
      - frontend-tests
      - frontend-e2e
      - frontend-security
      - python-security
      - python-dependency-security
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download sanitized test and audit artifacts
        uses: actions/download-artifact@v4
        with:
          path: evidence
          pattern: '*'
          merge-multiple: false
      - name: Merge measured test suites, coverage and security summaries
        run: python .github/scripts/quality_report.py evidence consolidated-quality.json
      - name: Publish per-run browser-readable evidence
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          report_dir="$(mktemp -d)"
          if git fetch origin quality-reports:refs/remotes/origin/quality-reports 2>/dev/null; then
            git worktree add -b quality-reports "$report_dir" origin/quality-reports
          else
            git worktree add --detach "$report_dir" HEAD
            git -C "$report_dir" checkout --orphan quality-reports
            git -C "$report_dir" rm -rf . >/dev/null
          fi
          mkdir -p "$report_dir/runs"
          cp consolidated-quality.json "$report_dir/runs/$RUN_ID.json"
          cp consolidated-quality.json "$report_dir/latest.json"
          git -C "$report_dir" add "runs/$RUN_ID.json" latest.json
          git -C "$report_dir" commit -m "Publish CI quality evidence for run $RUN_ID"
          git -C "$report_dir" push origin HEAD:quality-reports
