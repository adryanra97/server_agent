[project]
name = "serveragent-copdash-web"
version = "0.1.0"
description = "Faithful copdash verdict engines with a visual web interface"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.7,<3",
  "simpy>=4.1.2,<5",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "hypothesis>=6,<7",
  "pytest>=8.2",
  "pytest-cov>=6.0",
  "black>=25.1",
  "ruff>=0.11",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: simulation-heavy tests (SimPy property tests) excluded from CI"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
